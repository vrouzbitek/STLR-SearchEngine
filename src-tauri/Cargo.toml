[package]
name = "tauri-app"
version = "0.1.0"
description = "Self-learning, keyboard-first Windows 11 launcher (Rust + Tauri v2)"
authors = ["vrouz"]
license = "MIT"
repository = "https://github.com/vrouzbitek/STLR-SearchEngine"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
png = "0.18.1"
base64 = "0.23.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_System_Memory", "Win32_System_Shutdown", "Win32_System_Power", "Win32_UI_Shell_Common", "Win32_Storage_Packaging_Appx", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_System_RemoteDesktop", "Win32_System_Ole"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
ureq = { version = "3.5.2", features = ["json"] }
tungstenite = "0.30.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-notification = "2.8.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
